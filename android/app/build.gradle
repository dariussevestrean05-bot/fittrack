plugins {
    id "com.android.application"
}

android {
    namespace "de.fittrack.app"
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "de.fittrack.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }
    buildFeatures {
        buildConfig true
    }
}

// kotlin-stdlib-jdk8/-jdk7 unter 1.8 enthalten noch Klassen, die seit 1.8 im
// kotlin-stdlib stecken -> Duplikat-Fehler (u.a. via androidx.webkit). Auf leere 1.8.22er-Jars zwingen.
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.20"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.20"
    }
}

dependencies {
    implementation "androidx.activity:activity:1.9.2"
    implementation "androidx.webkit:webkit:1.10.0"
}

// Optional: Build-Ausgaben in einen lokalen Pfad außerhalb des Repos legen
// (z.B. gegen OneDrive-/Antivirus-Locks). Nur aktiv, wenn die Property gesetzt ist:
//   %USERPROFILE%\.gradle\gradle.properties:  fittrack.buildDir=C:/pfad/zu/cache/app
// Ohne Property wird der Standardordner android/app/build verwendet.
def customBuildDir = project.findProperty("fittrack.buildDir")
if (customBuildDir) {
    buildDir = customBuildDir
}
