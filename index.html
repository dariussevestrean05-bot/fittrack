<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FitTrack</title>
    <style>
      body { background: #0D0F13; color: #F3F5F7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #splash { position: fixed; inset: 0; z-index: 10; background: #000; }
      #splash img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #boot-status { position: fixed; left: 0; right: 0; bottom: 8%; z-index: 11; padding: 40px 20px; text-align: center; font-size: 0.9rem; opacity: 0.8; }
      #boot-error { display: none; position: fixed; left: 0; right: 0; bottom: 8%; z-index: 12; margin: 16px; padding: 14px; border-radius: 12px; background: rgba(20,20,25,0.92); border: 1px solid rgba(255,92,92,0.4); font-size: 0.85rem; white-space: pre-wrap; }
    </style>
    <!-- Offline-Vendor (nur lokale Dateien, keine CDN-Referenzen). Läuft unter file:///android_asset/ und http://localhost. -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>
    <!-- lucide-react UMD liest React als window.react (klein); Alias vor dem Laden setzen. -->
    <script>window.react = window.react || window.React;</script>
    <script src="./vendor/lucide-react.min.js"></script>
    <!-- Cover früh dekodieren, damit das Zoom-Intro nicht hängt. -->
    <link rel="preload" as="image" href="splash.png" />
  </head>
  <body>
    <div id="root"></div>
    <div id="splash"><img src="splash.png" alt="" onerror="this.style.display='none'" /></div>
    <div id="boot-status">FitTrack wird geladen …</div>
    <div id="boot-error"></div>
    <script type="module">
      const hideSplash = () => { document.querySelector("#splash")?.remove(); };
      const showBootError = (msg) => {
        document.querySelector("#boot-status")?.remove();
        const el = document.querySelector("#boot-error");
        if (el) {
          el.style.display = "block";
          el.textContent = String(msg);
          const btn = document.createElement("button");
          btn.textContent = "Erneut versuchen";
          btn.style.cssText = "margin-top:12px;padding:10px 18px;border-radius:12px;border:none;background:#FF5A36;color:#fff;font-weight:700;cursor:pointer;";
          btn.onclick = () => window.location.reload();
          el.appendChild(document.createElement("br"));
          el.appendChild(btn);
        }
      };
      let step = "init";
      try {
        step = "prüfe vendor";
        if (!window.React) throw new Error("vendor/react.production.min.js fehlt oder ist defekt.");
        if (!window.ReactDOM) throw new Error("vendor/react-dom.production.min.js fehlt oder ist defekt.");
        if (!window.Babel) throw new Error("vendor/babel.min.js fehlt oder ist defekt.");
        if (!window.LucideReact) throw new Error("vendor/lucide-react.min.js fehlt oder ist defekt.");
        const React = window.React;
        const { createRoot } = window.ReactDOM;
        const Babel = window.Babel;

        window.storage ??= {
          get: async (key) => {
            try {
              const value = localStorage.getItem(key);
              return value === null ? null : { value };
            } catch { return null; }
          },
          set: async (key, value) => {
            try { localStorage.setItem(key, value); } catch (e) { console.error("Speichern fehlgeschlagen", e); }
          },
        };
        step = "lade fitX.js";
        // Hinweis: fetch() unterstützt das file://-Schema im WebView nicht,
        // XMLHttpRequest mit AllowFileAccessFromFileURLs dagegen schon.
        let source = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", "fitX.js", true);
          xhr.onload = () => {
            if (xhr.status === 200 || (xhr.status === 0 && xhr.responseText)) resolve(xhr.responseText);
            else reject(new Error("fitX.js konnte nicht geladen werden (Status " + xhr.status + ")."));
          };
          xhr.onerror = () => reject(new Error("fitX.js konnte nicht gelesen werden."));
          xhr.send();
        });
        step = "kompiliere JSX";
        const compiledRaw = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] }).code;
        // Bare-Imports auf Offline-Globals umschreiben:
        const compiled = compiledRaw
          .replace(/import\s+React\s*,\s*\{([^}]+)\}\s*from\s*["']react["'];?/g, "const React = window.React; const {$1} = window.React;")
          .replace(/import\s+React\s+from\s*["']react["'];?/g, "const React = window.React;")
          .replace(/import\s*\{([^}]+)\}\s*from\s*["']lucide-react["'];?/g, "const {$1} = window.LucideReact;");
        if (/from\s+["']react["']|from\s+["']lucide-react["']/.test(compiled)) {
          throw new Error("Bare-Import (react/lucide-react) konnte nicht auf window-Globals umgeschrieben werden.");
        }
        step = "starte App";
        const moduleUrl = URL.createObjectURL(new Blob([compiled], { type: "text/javascript" }));
        const { default: App } = await import(moduleUrl);
        document.querySelector("#boot-status")?.remove();
        createRoot(document.querySelector("#root")).render(React.createElement(App));
        // Splash bleibt für das Zoom-Intro der App stehen und wird dort ausgeblendet.
        setTimeout(hideSplash, 2500);
      } catch (e) {
        console.error(e);
        showBootError("Start fehlgeschlagen bei Schritt [" + step + "]: " + (e?.message || e) + "\n\nTipp: vendor/-Dateien prüfen (react, react-dom, babel, lucide-react) – kein Internet nötig.");
      }
    </script>
  </body>
</html>
